body{
height:100vh;

radial-gradient(circle,#73003b 0%,#2b0016 70%,#120009 100%);
overflow:hidden;
}

.container{

width:420px;
max-width:90%;
background:white;
border-radius:28px;
padding:28px;
text-align:center;

box-shadow:
0 0 30px #ff8ad4,
0 0 80px rgba(255,255,255,.45);

}

h1{

font-size:18px;
font-weight:900;
margin-bottom:25px;

}

.btn{

position:relative;
display:block;

margin:18px 0;

padding:18px;

text-decoration:none;

color:white;

font-size:18px;
font-weight:bold;

background:#121212;

border:3px solid gold;

border-radius:18px;

overflow:hidden;

box-shadow:
0 8px 18px rgba(0,0,0,.35),
0 0 12px rgba(255,215,0,.45);

animation:float 3s ease-in-out infinite;

transition:.25s;

}

.btn:nth-child(2){
animation-delay:.4s;
}

.btn:nth-child(3){
animation-delay:.8s;
}

.btn:nth-child(4){
animation-delay:1.2s;
}

.btn:hover{

transform:scale(1.05);

box-shadow:
0 0 25px gold,
0 0 40px gold;

}

.btn::before{

content:"";

position:absolute;

top:-80%;

left:-120%;

width:45%;

height:260%;

background:rgba(255,255,255,.25);

transform:rotate(25deg);

animation:shine 2.5s linear infinite;

}

@keyframes shine{

0%{
left:-150%;
}

100%{
left:170%;
}

}

@keyframes float{

0%{
transform:translateY(0px);
}

50%{
transform:translateY(-8px);
}

100%{
transform:translateY(0px);
}

}

</style>
